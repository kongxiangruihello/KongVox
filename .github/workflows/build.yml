name: macOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KongVox-Mac
          path: dist/KongVox-0.3-Mac.zip
